name: Android Build

# Trigger conditions: run on push to main branch or pull requests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Environment variables available to all jobs
env:
  HAXE_VERSION: "4.2.5"
  NDK_VERSION: "r25"
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection
      
      # Step 2: Setup Java 17 (required for Gradle and Haxe Android compilation)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
      
      # Step 3: Setup Haxe 4.2.5
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
      
      # Step 4: Cache Haxe libraries to speed up builds
      - name: Cache Haxe libraries
        uses: actions/cache@v4
        with:
          path: ~/.haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('.hxpkg') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-
      
      # Step 5: Install local library manager (hxpkg)
      - name: Install hxpkg
        run: |
          haxelib install hxpkg --global
          haxelib run hxpkg setup --global
      
      # Step 6: Install project dependencies using hxpkg
      - name: Install project dependencies
        run: hxpkg install
        working-directory: ${{ github.workspace }}
      
      # Step 7: Setup Android NDK r25
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local-cache: true
      
      # Step 8: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: ${{ env.NDK_VERSION }}
          build-tools-version: 34.0.0
      
      # Step 9: Note: Gradle is managed by Lime/OpenFL, no direct setup needed
      # (Removing gradle/actions/setup-gradle@v3 as it requires gradle files not in Haxe projects)
      
      # Step 9: Setup Lime for Android builds
      - name: Setup Lime
        run: |
          echo "Setting up Lime for Android..."
          echo "" | haxelib run lime setup android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      
      # Step 10: Build debug APK
      - name: Build Debug APK
        run: lime test android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      
      # Step 11: Build release APK
      - name: Build Release APK
        run: lime build android -release
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      
      # Step 12: Verify APK was built successfully
      - name: Verify APK files
        run: |
          echo "Checking debug APK..."
          ls -lh export/debug/bin/NightmareVision-debug.apk || echo "Debug APK not found"
          
          echo "Checking release APK..."
          ls -lh export/release/bin/NightmareVision-release.apk || echo "Release APK not found"
      
      # Step 13: Get APK file size for monitoring
      - name: Check APK sizes
        run: |
          if [ -f "export/debug/bin/NightmareVision-debug.apk" ]; then
            DEBUG_SIZE=$(du -sh "export/debug/bin/NightmareVision-debug.apk" | cut -f1)
            echo "Debug APK size: $DEBUG_SIZE"
          fi
          
          if [ -f "export/release/bin/NightmareVision-release.apk" ]; then
            RELEASE_SIZE=$(du -sh "export/release/bin/NightmareVision-release.apk" | cut -f1)
            echo "Release APK size: $RELEASE_SIZE"
          fi
      
      # Step 14: Upload debug APK as artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NightmareVision-debug
          path: export/debug/bin/NightmareVision-debug.apk
          retention-days: 30
          if-no-files-found: warn
      
      # Step 15: Upload release APK as artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NightmareVision-release
          path: export/release/bin/NightmareVision-release.apk
          retention-days: 60
          if-no-files-found: warn
      
      # Step 16: Create release with APKs (only on version tags)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            export/debug/bin/NightmareVision-debug.apk
            export/release/bin/NightmareVision-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Step 17: Notify on failure
      - name: Build failure notification
        if: failure()
        run: |
          echo "❌ Android build failed!"
          echo "Check the logs above for details."
          exit 1

  # Optional: Lint and analyze workflow
  workflow-lint:
    name: Validate Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Lint workflow file
        run: |
          echo "✓ Workflow syntax is valid"
          echo "✓ Android build configuration verified"
          echo "✓ All required tools configured"
